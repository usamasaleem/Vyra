# Configuration for the Vyra staff inbox site.
#
# This file is read because the site's "package directory" is set to
# app/inbox in the Netlify UI. Netlify searches package directory, then base
# directory, then the repository root — so this takes precedence over the root
# netlify.toml, which belongs to the separate dashboard site.
#
# The site's "base directory" stays the repository root. Dependencies install
# and the build runs there, which is what npm workspaces require: installing
# inside app/inbox would try to resolve @vyra/db from the registry and fail.

[build]
  # The root script builds the workspace packages with tsc first, then the
  # Next application. Running `next build` alone would fail: the app imports
  # @vyra/db from its compiled dist, which would not exist yet.
  command = "npm run build"
  publish = "app/inbox/.next"

[build.environment]
  # Matches the engines field. Node 24 is the LTS line; local development runs
  # 25, and the difference has not mattered so far.
  NODE_VERSION = "24"

  # Netlify fails a build when an environment variable's value appears in the
  # build output. That is a good default and it caught a real case on the first
  # deploy — but these three are not secrets, and their values are in the
  # repository on purpose:
  #
  #   WHATSAPP_API_VERSION            "v26.0". A Meta API version, documented
  #                                   as the default in the env schema.
  #   NEXT_PUBLIC_SUPABASE_URL        The project URL, sent to every browser.
  #   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  #                                   Designed to be visible in a browser; it
  #                                   grants nothing without a session.
  #
  # The variables that ARE secret — the access token, the app secret and the
  # database URL — are deliberately absent from this list, so the scanner still
  # fails the build if any of them ever reaches the output.
  SECRETS_SCAN_OMIT_KEYS = "WHATSAPP_API_VERSION,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
