<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 672" width="1280" height="672" role="img" aria-label="Proposed Vyra Sales Agent architecture. A customer messages on WhatsApp; Meta's Cloud API delivers it to a webhook in the Next.js application, which verifies the signature and stores the message before acknowledging. A graphile-worker process picks the job up from PostgreSQL, runs the AI turn against the OpenAI Responses API, requests availability from Operations, and dispatches the reply back through Meta. Supabase provides the single PostgreSQL datastore, which also holds the job queue and outbox, plus auth and file storage.">
  <defs>
    <marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#0D0D0D"/>
    </marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#9B9B9B"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#00A651"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="672" fill="#F7F7F7"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ============ BAND 1 — channel ============ -->
    <rect x="16" y="16" width="1248" height="112" rx="18" fill="#FFFFFF" stroke="#E6E6E6"/>

    <rect x="40" y="48" width="48" height="48" rx="15" fill="#00A651"/>
    <rect x="52" y="60" width="24" height="17" rx="6" fill="#FFFFFF"/>
    <path d="M57,77 L57,84 L65,77 z" fill="#FFFFFF"/>
    <circle cx="58" cy="68.5" r="1.7" fill="#00A651"/>
    <circle cx="64" cy="68.5" r="1.7" fill="#00A651"/>
    <circle cx="70" cy="68.5" r="1.7" fill="#00A651"/>

    <text x="104" y="64" font-size="15.5" font-weight="700" fill="#0D0D0D">Customer (WhatsApp)</text>
    <text x="104" y="84" font-size="11.5" fill="#6B6B6B">Sends enquiries, gets answers, books cars</text>

    <rect x="420" y="40" width="262" height="28" rx="10" fill="#F1F1F1"/>
    <text x="432" y="58" font-size="10.5" fill="#0D0D0D">Hi, is the Ferrari available this weekend?</text>
    <rect x="420" y="76" width="262" height="28" rx="10" fill="#00A651"/>
    <text x="432" y="94" font-size="10.5" fill="#FFFFFF">Yes — let me check availability for you…</text>

    <line x1="712" y1="72" x2="890" y2="72" stroke="#00A651" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#aGreen)"/>
    <text x="801" y="56" font-size="12" font-weight="700" text-anchor="middle" fill="#0D0D0D">WhatsApp Cloud API</text>
    <text x="801" y="92" font-size="10.5" text-anchor="middle" fill="#6B6B6B">send and receive</text>

    <rect x="920" y="36" width="328" height="72" rx="14" fill="#F1F1F1"/>
    <rect x="940" y="54" width="36" height="36" rx="11" fill="#0D0D0D"/>
    <circle cx="953" cy="72" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
    <circle cx="963" cy="72" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
    <text x="992" y="62" font-size="14" font-weight="700" fill="#0D0D0D">Meta</text>
    <text x="992" y="79" font-size="10.5" fill="#6B6B6B">WhatsApp Cloud API</text>
    <text x="992" y="95" font-size="10" fill="#9B9B9B">the only channel; templates outside 24h</text>

    <line x1="120" y1="128" x2="120" y2="150" stroke="#9B9B9B" stroke-width="1.5" marker-end="url(#aGrey)"/>
    <text x="134" y="145" font-size="10" fill="#6B6B6B">inbound webhook</text>

    <line x1="716" y1="150" x2="716" y2="130" stroke="#00A651" stroke-width="1.5" marker-end="url(#aGreen)"/>
    <text x="730" y="145" font-size="10" fill="#008A43">outbound via dispatcher</text>

    <!-- ============ BAND 2 — application ============ -->
    <rect x="16" y="152" width="430" height="320" rx="18" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect x="36" y="172" width="40" height="40" rx="13" fill="#0D0D0D"/>
    <text x="56" y="199" font-size="18" font-weight="800" text-anchor="middle" fill="#FFFFFF">N</text>
    <text x="88" y="190" font-size="14.5" font-weight="700" fill="#0D0D0D">Next.js application</text>
    <text x="88" y="207" font-size="10.5" fill="#6B6B6B">sales inbox + WhatsApp webhook</text>
    <rect x="350" y="174" width="76" height="22" rx="11" fill="#F1F1F1"/>
    <circle cx="364" cy="185" r="3.5" fill="#D9822B"/>
    <text x="374" y="189" font-size="10" font-weight="600" fill="#6B6B6B">Proposed</text>

    <rect x="36" y="226" width="390" height="76" rx="13" fill="#F7F7F7"/>
    <text x="52" y="248" font-size="12" font-weight="600" fill="#0D0D0D">Webhook endpoint</text>
    <text x="52" y="266" font-size="10" fill="#9B9B9B">/api/whatsapp/webhook</text>
    <text x="250" y="246" font-size="10" fill="#6B6B6B">verify signature (raw body)</text>
    <text x="250" y="264" font-size="10" fill="#6B6B6B">deduplicate provider id</text>
    <text x="250" y="282" font-size="10" fill="#6B6B6B">store before acknowledging</text>

    <rect x="36" y="312" width="390" height="88" rx="13" fill="#F7F7F7"/>
    <text x="52" y="334" font-size="12" font-weight="600" fill="#0D0D0D">Business rules</text>
    <text x="52" y="354" font-size="10" fill="#6B6B6B">authorise every tool the model asks for</text>
    <text x="52" y="372" font-size="10" fill="#6B6B6B">reply ownership and takeover</text>
    <text x="52" y="390" font-size="10" fill="#6B6B6B">handoff packet to a salesperson</text>

    <rect x="36" y="410" width="390" height="48" rx="13" fill="#F7F7F7"/>
    <text x="52" y="432" font-size="12" font-weight="600" fill="#0D0D0D">Sales inbox</text>
    <text x="52" y="449" font-size="10" fill="#9B9B9B">salespeople, managers, owner</text>

    <rect x="556" y="152" width="320" height="320" rx="18" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect x="576" y="172" width="40" height="40" rx="13" fill="#00A651"/>
    <circle cx="596" cy="192" r="7.5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
    <circle cx="596" cy="192" r="2" fill="#FFFFFF"/>
    <text x="628" y="190" font-size="14.5" font-weight="700" fill="#0D0D0D">Worker</text>
    <text x="628" y="207" font-size="10.5" fill="#6B6B6B">graphile-worker, on PostgreSQL</text>
    <rect x="780" y="174" width="76" height="22" rx="11" fill="#F1F1F1"/>
    <circle cx="794" cy="185" r="3.5" fill="#D9822B"/>
    <text x="804" y="189" font-size="10" font-weight="600" fill="#6B6B6B">Proposed</text>

    <rect x="576" y="226" width="280" height="32" rx="10" fill="#F7F7F7"/>
    <circle cx="594" cy="242" r="3.5" fill="#00A651"/>
    <text x="608" y="246" font-size="10.5" fill="#0D0D0D">Process inbound message</text>

    <rect x="576" y="264" width="280" height="32" rx="10" fill="#F7F7F7"/>
    <circle cx="594" cy="280" r="3.5" fill="#00A651"/>
    <text x="608" y="284" font-size="10.5" fill="#0D0D0D">Run the AI turn</text>

    <rect x="576" y="302" width="280" height="32" rx="10" fill="#F7F7F7"/>
    <circle cx="594" cy="318" r="3.5" fill="#00A651"/>
    <text x="608" y="322" font-size="10.5" fill="#0D0D0D">Request availability from Operations</text>

    <rect x="576" y="340" width="280" height="32" rx="10" fill="#F7F7F7"/>
    <circle cx="594" cy="356" r="3.5" fill="#00A651"/>
    <text x="608" y="360" font-size="10.5" fill="#0D0D0D">Dispatch the reply</text>

    <rect x="576" y="378" width="280" height="32" rx="10" fill="#F7F7F7"/>
    <circle cx="594" cy="394" r="3.5" fill="#9B9B9B"/>
    <text x="608" y="398" font-size="10.5" fill="#6B6B6B">Follow-ups and SLA reminders</text>

    <rect x="576" y="416" width="280" height="32" rx="10" fill="#F7F7F7"/>
    <circle cx="594" cy="432" r="3.5" fill="#9B9B9B"/>
    <text x="608" y="436" font-size="10.5" fill="#6B6B6B">Other background tasks</text>

    <rect x="966" y="152" width="298" height="116" rx="18" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect x="986" y="172" width="40" height="40" rx="13" fill="#0D0D0D"/>
    <circle cx="1006" cy="192" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <text x="1038" y="189" font-size="13" font-weight="700" fill="#0D0D0D">OpenAI Responses API</text>
    <text x="1038" y="206" font-size="10" fill="#6B6B6B">model unpinned until evaluated</text>
    <line x1="986" y1="228" x2="1244" y2="228" stroke="#EEEEEE"/>
    <text x="986" y="248" font-size="10" fill="#9B9B9B">proposes language; never authorises an action</text>

    <rect x="966" y="284" width="298" height="188" rx="18" fill="#FFFFFF" stroke="#E6E6E6"/>
    <text x="986" y="310" font-size="13" font-weight="700" fill="#0D0D0D">External integrations</text>
    <text x="986" y="327" font-size="10" fill="#9B9B9B">later phases, not in the MVP</text>
    <circle cx="991" cy="351" r="3" fill="#9B9B9B"/>
    <text x="1004" y="355" font-size="10.5" fill="#6B6B6B">Inventory / fleet system</text>
    <circle cx="991" cy="377" r="3" fill="#9B9B9B"/>
    <text x="1004" y="381" font-size="10.5" fill="#6B6B6B">Payment providers</text>
    <circle cx="991" cy="403" r="3" fill="#9B9B9B"/>
    <text x="1004" y="407" font-size="10.5" fill="#6B6B6B">Document handling</text>
    <circle cx="991" cy="429" r="3" fill="#9B9B9B"/>
    <text x="1004" y="433" font-size="10.5" fill="#6B6B6B">Email / SMS</text>
    <circle cx="991" cy="455" r="3" fill="#9B9B9B"/>
    <text x="1004" y="459" font-size="10.5" fill="#6B6B6B">Other APIs</text>

    <line x1="446" y1="246" x2="550" y2="246" stroke="#0D0D0D" stroke-width="1.5" marker-end="url(#aInk)"/>
    <text x="499" y="234" font-size="10" text-anchor="middle" fill="#6B6B6B">enqueue job</text>
    <text x="499" y="264" font-size="9.5" text-anchor="middle" fill="#9B9B9B">via the outbox</text>

    <line x1="552" y1="300" x2="450" y2="300" stroke="#9B9B9B" stroke-width="1.5" marker-end="url(#aGrey)"/>
    <text x="499" y="318" font-size="10" text-anchor="middle" fill="#6B6B6B">result + state</text>

    <line x1="876" y1="212" x2="960" y2="212" stroke="#0D0D0D" stroke-width="1.5" marker-end="url(#aInk)"/>
    <text x="918" y="201" font-size="9.5" text-anchor="middle" fill="#6B6B6B">prompt + tools</text>
    <line x1="960" y1="242" x2="880" y2="242" stroke="#9B9B9B" stroke-width="1.5" marker-end="url(#aGrey)"/>
    <text x="918" y="260" font-size="9.5" text-anchor="middle" fill="#6B6B6B">draft reply</text>

    <line x1="876" y1="350" x2="960" y2="350" stroke="#0D0D0D" stroke-width="1.5" marker-end="url(#aInk)"/>
    <text x="918" y="339" font-size="9.5" text-anchor="middle" fill="#6B6B6B">request</text>
    <line x1="960" y1="380" x2="880" y2="380" stroke="#9B9B9B" stroke-width="1.5" marker-end="url(#aGrey)"/>
    <text x="918" y="398" font-size="9.5" text-anchor="middle" fill="#6B6B6B">status</text>

    <!-- ============ BAND 3 — data ============ -->
    <line x1="231" y1="474" x2="231" y2="500" stroke="#9B9B9B" stroke-width="1.5" marker-start="url(#aGrey)" marker-end="url(#aGrey)"/>
    <text x="245" y="491" font-size="9.5" fill="#9B9B9B">reads and writes</text>
    <line x1="716" y1="474" x2="716" y2="500" stroke="#9B9B9B" stroke-width="1.5" marker-start="url(#aGrey)" marker-end="url(#aGrey)"/>
    <text x="730" y="491" font-size="9.5" fill="#9B9B9B">reads, writes, and polls the queue</text>

    <rect x="16" y="502" width="1248" height="154" rx="18" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect x="36" y="520" width="40" height="40" rx="13" fill="#00A651"/>
    <path d="M58,528 L48,545 L56,545 L54,552 L64,535 L56,535 z" fill="#FFFFFF"/>
    <text x="88" y="538" font-size="14.5" font-weight="700" fill="#0D0D0D">Supabase — one datastore</text>
    <text x="88" y="556" font-size="10.5" fill="#6B6B6B">the queue lives here too, so there is no Redis to run</text>
    <rect x="1160" y="522" width="76" height="22" rx="11" fill="#F1F1F1"/>
    <circle cx="1174" cy="533" r="3.5" fill="#D9822B"/>
    <text x="1184" y="537" font-size="10" font-weight="600" fill="#6B6B6B">Proposed</text>

    <rect x="36" y="578" width="294" height="62" rx="13" fill="#F7F7F7"/>
    <text x="52" y="598" font-size="11.5" font-weight="600" fill="#0D0D0D">PostgreSQL</text>
    <text x="52" y="616" font-size="9.5" fill="#6B6B6B">conversations · enquiries · messages</text>
    <text x="52" y="630" font-size="9.5" fill="#6B6B6B">jobs (queue) · outbox · audit events</text>

    <rect x="346" y="578" width="294" height="62" rx="13" fill="#F7F7F7"/>
    <text x="362" y="598" font-size="11.5" font-weight="600" fill="#0D0D0D">Auth</text>
    <text x="362" y="616" font-size="9.5" fill="#6B6B6B">users · roles · operator membership</text>
    <text x="362" y="630" font-size="9.5" fill="#6B6B6B">RLS, plus scoping inside the worker</text>

    <rect x="656" y="578" width="294" height="62" rx="13" fill="#F7F7F7"/>
    <text x="672" y="598" font-size="11.5" font-weight="600" fill="#0D0D0D">Storage</text>
    <text x="672" y="616" font-size="9.5" fill="#6B6B6B">documents · vehicle images</text>
    <text x="672" y="630" font-size="9.5" fill="#6B6B6B">private, separate from the inbox</text>

    <rect x="966" y="578" width="298" height="62" rx="13" fill="#F7F7F7"/>
    <text x="982" y="598" font-size="11.5" font-weight="600" fill="#0D0D0D">Realtime (optional)</text>
    <text x="982" y="616" font-size="9.5" fill="#6B6B6B">live inbox updates</text>
    <text x="982" y="630" font-size="9.5" fill="#6B6B6B">polling is fine for the pilot</text>
  </g>
</svg>
